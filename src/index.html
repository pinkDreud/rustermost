<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <script>
      // Apply the saved display settings before the first paint. main.js is a
      // deferred module, so it runs too late to stop a flash of the default
      // dark/medium look; this tiny blocking copy closes that gap. The values
      // MUST stay in sync with the SETTINGS_* constants in main.js.
      (function () {
        var FONT = { small: "13px", medium: "14px", large: "16px" };
        var s = {};
        try { s = JSON.parse(localStorage.getItem("rustermost.settings")) || {}; } catch (e) {}
        var root = document.documentElement;
        if (FONT[s.fontSize]) root.style.setProperty("--app-font-size", FONT[s.fontSize]);
        var light = s.theme === "light" ||
          (s.theme === "system" && window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches);
        root.dataset.theme = light ? "light" : "dark";
        root.dataset.density = s.density === "compact" ? "compact" : "comfortable";
      })();
    </script>
    <link rel="stylesheet" href="styles.css" />
    <title>rustermost</title>
    <script type="module" src="/main.js" defer></script>
  </head>
  <body>
    <!-- ===================== LOGIN ===================== -->
    <div id="login-view" class="login-view">
      <div class="login-card">
        <img class="login-logo" src="logo.png" alt="rustermost" />
        <h1 class="wordmark"><span class="rust">ruster</span>most</h1>
        <p class="login-sub">Connect to your Mattermost server</p>
        <form id="url-form" class="login-form">
          <input
            id="url-input"
            type="text"
            placeholder="https://mattermost.example.org"
            autocomplete="off"
            spellcheck="false"
          />
          <button type="submit" id="connect-btn">Connect</button>
        </form>
        <p id="login-status" class="login-status"></p>
      </div>
    </div>

    <!-- ===================== APP ===================== -->
    <div id="app-view" class="app-view hidden">
      <aside class="sidebar">
        <header class="sidebar-header">
          <div class="me-avatar" id="me-avatar">?</div>
          <div class="me-name" id="me-name">…</div>
          <button id="settings-btn" class="icon-btn settings-btn" title="Settings">⚙</button>
          <button id="new-btn" class="icon-btn" title="New conversation">＋</button>
        </header>
        <div class="search-wrap">
          <input id="search-input" type="text" placeholder="Search conversations…" autocomplete="off" />
        </div>
        <div class="channel-list" id="channel-list">
          <div class="list-empty">Loading channels…</div>
        </div>
      </aside>

      <main class="conversation">
        <div id="empty-state" class="empty-state">
          <div>
            <div class="empty-logo">💬</div>
            <p>Select a conversation to start reading.</p>
            <p class="empty-hint">New messages arrive live.</p>
          </div>
        </div>

        <div id="chat-panel" class="chat-panel hidden">
          <header class="chat-header">
            <div class="chat-title" id="chat-title"></div>
            <div class="chat-sub" id="chat-sub"></div>
          </header>
          <div class="messages" id="messages"></div>
          <div id="pending-files" class="pending-files hidden"></div>
          <form class="composer" id="composer">
            <button type="button" id="attach-btn" class="attach-btn" title="Attach files">📎</button>
            <input id="file-input" type="file" multiple class="hidden" />
            <textarea
              id="composer-input"
              rows="1"
              placeholder="Type a message…  (Enter to send, Shift+Enter for a new line)"
            ></textarea>
            <button type="submit" id="send-btn" title="Send">➤</button>
          </form>
        </div>
      </main>
    </div>

    <!-- ===================== NEW CONVERSATION MODAL ===================== -->
    <div id="modal-overlay" class="modal-overlay hidden">
      <div class="modal">
        <div class="modal-header">
          <div class="seg">
            <button id="seg-chat" class="seg-btn active" type="button">Chat</button>
            <button id="seg-channel" class="seg-btn" type="button">Channel</button>
          </div>
          <button id="modal-close" class="modal-close" type="button" title="Close">✕</button>
        </div>

        <!-- CHAT MODE: pick people -->
        <div id="mode-chat" class="modal-body">
          <div id="chat-chips" class="chips"></div>
          <input id="people-search" class="modal-input" placeholder="Search people…" autocomplete="off" spellcheck="false" />
          <div id="people-results" class="people-results"></div>
          <p class="modal-hint">1 person → direct message · 2 or more → group.</p>
          <p id="chat-error" class="modal-error"></p>
          <button id="chat-create" class="modal-primary" type="button" disabled>Start chat</button>
        </div>

        <!-- CHANNEL MODE: named channel in a team -->
        <div id="mode-channel" class="modal-body hidden">
          <label class="modal-label">Team</label>
          <select id="channel-team" class="modal-input"></select>
          <label class="modal-label">Channel name</label>
          <input id="channel-name" class="modal-input" placeholder="e.g. project-updates" autocomplete="off" spellcheck="false" />
          <div class="radio-row">
            <label><input type="radio" name="ch-type" value="O" checked /> Public</label>
            <label><input type="radio" name="ch-type" value="P" /> Private</label>
          </div>
          <p id="channel-error" class="modal-error"></p>
          <button id="channel-create" class="modal-primary" type="button" disabled>Create channel</button>
        </div>
      </div>
    </div>

    <!-- ===================== SETTINGS MODAL ===================== -->
    <div id="settings-overlay" class="modal-overlay hidden">
      <div class="modal">
        <div class="modal-header">
          <div class="modal-title">Settings</div>
          <button id="settings-close" class="modal-close" type="button" title="Close">✕</button>
        </div>
        <div class="modal-body">
          <div class="setting-row">
            <div class="modal-label">Font size</div>
            <div class="seg option-seg" data-setting="fontSize" role="group" aria-label="Font size">
              <button class="seg-btn" type="button" data-value="small">Small</button>
              <button class="seg-btn" type="button" data-value="medium">Medium</button>
              <button class="seg-btn" type="button" data-value="large">Large</button>
            </div>
          </div>
          <div class="setting-row">
            <div class="modal-label">Theme</div>
            <div class="seg option-seg" data-setting="theme" role="group" aria-label="Theme">
              <button class="seg-btn" type="button" data-value="dark">Dark</button>
              <button class="seg-btn" type="button" data-value="light">Light</button>
              <button class="seg-btn" type="button" data-value="system">System</button>
            </div>
          </div>
          <div class="setting-row">
            <div class="modal-label">Message density</div>
            <div class="seg option-seg" data-setting="density" role="group" aria-label="Message density">
              <button class="seg-btn" type="button" data-value="comfortable">Comfortable</button>
              <button class="seg-btn" type="button" data-value="compact">Compact</button>
            </div>
          </div>
          <p class="modal-hint settings-hint">Changes apply immediately and are remembered.</p>
        </div>
      </div>
    </div>
  </body>
</html>
